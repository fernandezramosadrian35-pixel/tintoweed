<style>
:root{--bg:#0e0816;--panel:rgba(20,12,32,.9);--line:rgba(255,255,255,.09);--acc:#e040a0;--acc2:#2dd4bf;--ok:#4ade80;--bad:#fb7185;--warn:#ffb347}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,system-ui,sans-serif;color:#e9e4f1;-webkit-tap-highlight-color:transparent}
.hd{font-family:'Chakra Petch',sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.glass{background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line)}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .3s;z-index:90}
#hud{position:fixed;top:0;left:0;right:0;min-height:54px;z-index:30;display:flex;align-items:center;gap:12px;padding:6px 12px;padding-top:max(6px,env(safe-area-inset-top));border-width:0 0 1px 0;flex-wrap:wrap}
.logo{font-weight:700;font-size:20px;letter-spacing:.04em}.logo span{color:var(--acc)}
.stats{display:flex;gap:14px;flex:1;align-items:center;min-width:0}
.stat{display:flex;flex-direction:column;line-height:1.1}.stat small{font-size:10px;color:#a79bb8}.stat b{font-family:'Chakra Petch';font-size:16px}
.stat em{font-size:11px;color:#a79bb8;font-style:normal}
.ctrls{display:flex;gap:4px;align-items:center}
.ib{background:rgba(255,255,255,.07);border:1px solid var(--line);color:#e9e4f1;border-radius:9px;padding:6px 9px;font-size:13px;cursor:pointer}
.ib.on{background:var(--acc);border-color:var(--acc);color:#fff}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.07);color:#fff;border-radius:9px;padding:7px 11px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Chakra Petch'}
.btn:hover:not(:disabled){filter:brightness(1.2)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn-p{background:linear-gradient(135deg,#c026d3,#7c3aed);border-color:transparent}
.btn-g{background:linear-gradient(135deg,#0d9488,#0891b2);border-color:transparent}
.btn-r{background:linear-gradient(135deg,#be123c,#9f1239);border-color:transparent}
#side{position:fixed;z-index:25;top:64px;right:8px;bottom:8px;width:396px;border-radius:16px;display:flex;flex-direction:column;transition:transform .35s}
#side.off{transform:translateX(112%)}
#tabs{display:flex;gap:3px;padding:6px;border-bottom:1px solid var(--line)}
.tab{flex:1;padding:6px 2px;font-size:11px;border-radius:10px;color:#a79bb8;background:transparent;border:0;cursor:pointer;font-family:'Chakra Petch';line-height:1.2}
.tab.on{background:linear-gradient(135deg,#a21caf,#6d28d9);color:#fff}
#tabbody{overflow:auto;padding:10px;flex:1}
.card{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.card.sel{border-color:var(--acc2);box-shadow:0 0 0 1px var(--acc2)}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.bar.sm{width:70px}.bar>i{display:block;height:100%;width:0;border-radius:99px;transition:width .25s linear}
.chip{font-size:10px;padding:2px 7px;border-radius:99px;background:rgba(255,255,255,.09);white-space:nowrap}
.chip.ok{background:rgba(74,222,128,.18);color:var(--ok)}.chip.bad{background:rgba(251,113,133,.18);color:var(--bad)}.chip.warn{background:rgba(255,179,71,.18);color:var(--warn)}
.sbtn{flex:1;min-width:80px;padding:7px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:#fff;font-size:11px;cursor:pointer;text-align:left}
.sbtn.on{border-color:var(--acc2);background:rgba(45,212,191,.12)}.sbtn:disabled{opacity:.4;cursor:not-allowed}
.pip{display:inline-block;width:9px;height:5px;border-radius:2px;background:rgba(255,255,255,.14);margin-right:2px}.pip.on{background:var(--acc2)}
#mstrip{position:fixed;left:10px;top:66px;z-index:20;width:250px;display:flex;flex-direction:column;gap:5px;pointer-events:none}
.ms{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:11px}
#log{position:fixed;left:10px;bottom:10px;z-index:20;width:330px;font-size:11px;color:#c9bfd8;pointer-events:none;text-shadow:0 1px 3px #000}
#log div{margin-top:3px;animation:fl 8s forwards}
@keyframes fl{0%,80%{opacity:1}100%{opacity:0}}
#hint{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);font-size:11px;color:#a79bb8;z-index:15;pointer-events:none;text-align:center;text-shadow:0 1px 3px #000}
#toasts{position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(440px,92vw)}
.toast{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc2);padding:8px 12px;border-radius:10px;font-size:12px;animation:ti .25s,to .4s 4s forwards}
.toast.ok{border-left-color:var(--ok)}.toast.bad{border-left-color:var(--bad)}.toast.warn{border-left-color:var(--warn)}
@keyframes ti{from{opacity:0;transform:translateY(-8px)}}@keyframes to{to{opacity:0}}
.fl{position:fixed;z-index:40;font-family:'Chakra Petch';font-weight:700;font-size:16px;pointer-events:none;text-shadow:0 2px 6px #000;animation:up 1.8s forwards}
@keyframes up{to{transform:translateY(-50px);opacity:0}}
.mbg{position:fixed;inset:0;background:rgba(5,2,10,.7);z-index:70;display:flex;align-items:center;justify-content:center;padding:12px}
.mbox{width:min(460px,100%);max-height:90vh;overflow:auto;border-radius:16px;padding:16px}
#sel{position:fixed;inset:0;z-index:80;background:rgba(8,4,14,.78);backdrop-filter:blur(6px);overflow:auto;padding:18px;display:flex;flex-direction:column;align-items:center}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;width:min(1000px,100%);margin:14px 0}
.cc{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;text-align:center;transition:transform .15s}
.cc:hover{transform:translateY(-3px)}.cc.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc),0 0 24px rgba(224,64,160,.4)}
#tut{position:fixed;inset:0;z-index:75;pointer-events:none}
.tb{position:absolute;pointer-events:auto;width:min(380px,92vw);border-radius:16px;padding:16px;border:1px solid var(--acc);box-shadow:0 0 30px rgba(224,64,160,.35)}
.tb.c{left:50%;top:50%;transform:translate(-50%,-50%)}.tb.s{right:420px;top:90px}.tb.n{left:50%;bottom:50px;transform:translateX(-50%)}
@media(max-width:700px){.tb.s{right:auto;left:50%;top:70px;transform:translateX(-50%)}#side{top:auto;left:6px;right:6px;bottom:6px;width:auto;height:46vh}#side.off{transform:translateY(112%)}#mstrip{width:190px}#log{display:none}#hint{display:none}.stat small{display:none}.logo{font-size:15px}.stats{gap:9px}}
#tring{position:fixed;z-index:74;width:90px;height:90px;margin:-45px 0 0 -45px;border:3px solid var(--acc);border-radius:50%;pointer-events:none;display:none;animation:pr 1.2s infinite}
@keyframes pr{0%{transform:scale(.7);opacity:1}100%{transform:scale(1.5);opacity:0}}
.hl{outline:2px solid var(--acc2);outline-offset:2px;animation:hp 1s infinite}@keyframes hp{50%{outline-color:transparent}}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:9px}
</style>

<script>
'use strict';
/* ====================== UTILIDADES ====================== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const fmt=n=>Math.round(n).toLocaleString('es-ES')+' €';
const V3=THREE.Vector3;
const OFF=600,DAY_LEN=30,PAY_EVERY=7,SAVE_KEY='latinto_save_v1';
const NODES=[-57,-19,19,57];
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let actx=null;
function sfx(t){if(UI.mute)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain(),n=actx.currentTime;const f={coin:[880,1320],bad:[240,120],up:[520,820],click:[500,560]}[t]||[500,500];o.type=t==='bad'?'sawtooth':'triangle';o.frequency.setValueAtTime(f[0],n);o.frequency.linearRampToValueAtTime(f[1],n+.12);g.gain.setValueAtTime(.05,n);g.gain.exponentialRampToValueAtTime(.0001,n+.2);o.connect(g);g.connect(actx.destination);o.start();o.stop(n+.22)}catch(e){}}

/* ====================== DATOS ====================== */
const ROLES={
 boss:{n:'Boss',s:'Boss',i:'👑',base:0,d:'Dirige la organización y permanece siempre en La Tinto.'},
 regador:{n:'Regador',s:'Regador',i:'💧',base:30,d:'Riega las plantas solo. Más nivel: riega más rápido y mejora la calidad.'},
 vendedor:{n:'Vendedor / Negociador',s:'Vendedor',i:'🤝',base:40,d:'Mejora el precio y la cantidad que se vende en cada reparto.'},
 buscador:{n:'Buscador de Objetos',s:'Buscador',i:'🔎',base:35,d:'Sale en coche a por ingredientes. Más nivel: más cantidad y hallazgos raros.'},
 repartidor:{n:'Conductor de reparto',s:'Repartidor',i:'🚚',base:35,d:'Lleva la mercancía en coche. Más nivel: entregas más rápidas.'},
 policia:{n:'Evitador de policía',s:'Anti-poli',i:'🚓',base:45,d:'Reduce el riesgo policial durante los repartos.'},
 ojeador:{n:'Ojeador de Barrios',s:'Ojeador',i:'👁',base:30,d:'Recorre barrios para subir la confianza y analizarlos.'},
 conductor:{n:'Conductor de búsqueda',s:'Chófer',i:'🚗',base:35,d:'Conduce el coche de las búsquedas. Más nivel: trayectos más rápidos.'},
 cosechador:{n:'Cosechador',s:'Cosechador',i:'🌾',base:30,d:'Cosecha y replanta. Más nivel: más rendimiento y mejor calidad.'},
 tecnico:{n:'Técnico de Laboratorio',s:'Técnico',i:'⚗️',base:45,d:'Procesa las mezclas que ordenas. Más nivel: menos tiempo.'},
 asaltante:{n:'Asaltante / Infiltrado',s:'Asaltante',i:'🥷',base:40,d:'Roba dinero y mercancía a bandas rivales. Falla en zona hostil y puede ser secuestrado.'}
};
const ROLE_ORDER=['boss','regador','cosechador','tecnico','buscador','conductor','repartidor','vendedor','policia','ojeador','asaltante'];
const effText=(r,l)=>({
 boss:'Sin nivel · dirige la banda',
 regador:`Riega cada ${Math.max(.8,3.2-.22*(l-1)).toFixed(1)}s · Calidad +${((l-1)*1.5).toFixed(1)}`,
 vendedor:`Precio +${5*(l-1)}% · Tope a precio completo: ${6+3*l} uds`,
 buscador:`Hallazgo ${3+Math.floor(l/2)} uds · ${8*l}% de +2 extra`,
 repartidor:`Velocidad de reparto ×${(1+.14*(l-1)).toFixed(2)}`,
 policia:`Riesgo policial −${Math.round((1-polRed(l))*100)}%`,
 ojeador:`Confianza +${(5+1.3*l).toFixed(1)} por ronda · velocidad ×${(1+.12*(l-1)).toFixed(2)}`,
 conductor:`Velocidad de búsqueda ×${(1+.14*(l-1)).toFixed(2)}`,
 cosechador:`Cosecha +${Math.floor((l-1)/2)} uds · Calidad +${((l-1)*1.5).toFixed(1)} · ${Math.max(1,4-.3*(l-1)).toFixed(1)}s`,
 tecnico:`Mezcla ×${(1+.2*(l-1)).toFixed(2)} más rápida (${(24/(1+.2*(l-1))).toFixed(0)}s)`,
 asaltante:`Éxito base ${Math.round(clamp(.2+.04*l,.1,.9)*100)}% (+ confianza del barrio)`
})[r];
function polRed(l){return Math.max(.2,1-.08*(l-1))}
const CHARS=[
{id:'jeilian',n:'Jeilian',role:'boss',h:1.2,w:.78,skin:'#f1d6bd',hair:'#3a2a1f',style:'short',acc:'',shirt:'#7c3aed',desc:'Alto, delgado, piel clara, pelo castaño oscuro.'},
{id:'marki',n:'Marki',role:'regador',h:.9,w:.8,skin:'#f1d6bd',hair:'#3a2a1f',style:'short',acc:'cap',shirt:'#0ea5e9',desc:'Estatura media-baja, delgado, pelo castaño oscuro con gorra.'},
{id:'cachon',n:'Cachón',role:'vendedor',h:1.2,w:.78,skin:'#d8a77c',hair:'#3a2a1f',style:'vshort',acc:'',shirt:'#f59e0b',desc:'Alto, delgado, ligeramente moreno, pelo castaño oscuro corto.'},
{id:'sanmillan',n:'San Millán',role:'buscador',h:1,w:.95,skin:'#f1d6bd',hair:'#e6c35c',style:'long',acc:'glasses',shirt:'#84cc16',desc:'Estatura media, piel clara, pelo largo rubio y gafas.'},
{id:'fonsi',n:'Fonsi',role:'repartidor',h:.78,w:1.3,skin:'#f1d6bd',hair:'#3a2a1f',style:'short',acc:'',shirt:'#ef4444',desc:'Bajo, fuerte y ancho, piel clara, pelo castaño oscuro.'},
{id:'garmon',n:'Garmón',role:'policia',h:1.2,w:1.25,skin:'#ecd0b4',hair:'#5a3d28',style:'short',acc:'glasses',shirt:'#475569',desc:'Alto, fuerte, gafas, pelo castaño.'},
{id:'rodri',n:'Rodri',role:'ojeador',h:.74,w:.8,skin:'#f3dcc6',hair:'#ecc94b',style:'short',acc:'',shirt:'#14b8a6',desc:'Rubio y bajito.'},
{id:'dario',n:'Darío',role:'conductor',h:1.2,w:1.25,skin:'#e6c3a5',hair:'#101014',style:'short',acc:'',shirt:'#f97316',desc:'Alto, fuerte, pelo negro.'},
{id:'chino',n:'Chino',role:'cosechador',h:.8,w:.95,skin:'#b98557',hair:'#0c0c10',style:'short',acc:'',shirt:'#22c55e',desc:'Tez oscura, pelo negro, bajo.'},
{id:'izan',n:'Izan',role:'tecnico',h:.8,w:.9,skin:'#efd2b8',hair:'#0c0c10',style:'vshort',acc:'',shirt:'#e5e7eb',desc:'Bajito, pelo negro muy corto.'},
{id:'alejo',n:'Alejo',role:'asaltante',h:.8,w:.85,skin:'#9a6a46',hair:'#0c0c10',style:'short',acc:'',shirt:'#9f1239',desc:'Colombiano, tez oscura, pelo negro, bajito.'}
];
const STR=[
 {id:'verdina',n:'Verdina',c:'#4ade80',seed:20,time:40,yield:4,base:18,rep:0},
 {id:'azulita',n:'Azulita',c:'#60a5fa',seed:45,time:70,yield:4,base:38,rep:10},
 {id:'rubi',n:'Rubí',c:'#f43f5e',seed:90,time:110,yield:5,base:62,rep:25},

 {id:'violeta',n:'Esencia Violeta',adj:'Violeta',c:'#a855f7',cost:240,mult:6,time:120,rep:40}];

 {n:'Centro · La Tinto',gx:0,gz:0,price:.9,gang:.2,loot:.5,req:0,cost:0,trust:70,col:'#3a2a4f',rival:'—'},
 {n:'Las Eras',gx:1,gz:0,price:1.1,gang:.7,loot:.8,req:35,cost:600,trust:18,col:'#2f3b45',rival:'Los Cuervos'},
 {n:'Casco Viejo',gx:-1,gz:0,price:1.2,gang:.8,loot:.9,req:35,cost:700,trust:15,col:'#4a3a3a',rival:'Clan del Arco'},
 {n:'El Páramo',gx:0,gz:-1,price:1.15,gang:.75,loot:.85,req:38,cost:650,trust:20,col:'#3c4636',rival:'Los Gatos'},
 {n:'Polígono Sur',gx:0,gz:1,price:1.05,gang:.9,loot:1,req:38,cost:750,trust:12,col:'#35363f',rival:'La Hermandad'},

 {n:'La Ribera',gx:-1,gz:-1,price:1.55,gang:1.15,loot:1.35,req:50,cost:1700,trust:8,col:'#2f4a45',rival:'Hijos del Río'},
 {n:'Los Olmos',gx:1,gz:1,price:1.6,gang:1.2,loot:1.4,req:52,cost:1800,trust:9,col:'#45402c',rival:'Clan Olmedo'},
 {n:'Las Cumbres',gx:-1,gz:1,price:1.7,gang:1.3,loot:1.5,req:55,cost:2000,trust:6,col:'#43304a',rival:'Los Altos'}];

/* ====================== ESTADO ====================== */
let G=null,UI={tab:'team',strain:'verdina',rs:'verdina',ri:'lunar',rn:1,selD:null,speed:1,mute:false,dirty:true,deliv:null,panelHidden:false};
const jobs={regador:null,cosechador:null};
let started=false,mode='city',busyCam=false;
const markDirty=()=>{UI.dirty=true};
function newGame(bossId){
 const roleOf={};CHARS.forEach(c=>roleOf[c.id]=c.role);
 if(bossId!=='jeilian'){const vac=roleOf[bossId];roleOf[bossId]='boss';roleOf.jeilian=vac}
 const level={};CHARS.forEach(c=>level[c.id]=1);
 G={v:1,boss:bossId,roleOf,level,money:1500,day:1,tod:.33,rep:3,heat:0,owed:0,lastPay:1,plotCount:3,
  plots:Array.from({length:12},()=>({state:'empty',strain:null,growth:0,water:0,qAcc:0,quality:0})),
  inv:{goods:{},ing:{}},disc:{},queue:[],missions:[],kidnap:null,auto:true,tutDone:false,
  d:DIST.map(x=>({trust:x.trust,unlocked:x.req===0,scouted:x.req===0})),stats:{delivered:0,earned:0}};
 for(let i=0;i<2;i++){const p=G.plots[i];p.state='growing';p.strain='verdina';p.water=60}
}
const charById=id=>CHARS.find(c=>c.id===id);
const roleChar=r=>CHARS.find(c=>G.roleOf[c.id]===r);
const lvl=r=>{const c=roleChar(r);return c?G.level[c.id]:1};
const nm=r=>roleChar(r).n;

function plantPlot(i,sid){const p=G.plots[i],S=strOf(sid);if(p.state!=='empty')return false;if(G.rep<S.rep){toast(`${S.n} requiere reputación ${S.rep}`,'bad');return false}if(G.money<S.seed){toast('No hay dinero para la semilla','bad');return false}
 G.money-=S.seed;Object.assign(p,{state:'growing',strain:sid,growth:0,water:55,qAcc:0,quality:0});markDirty();return true}
function harvestPlot(i,auto){const p=G.plots[i];if(p.state!=='ready')return;const S=strOf(p.strain),l=lvl('cosechador');
 const qty=S.yield+(auto?Math.floor((l-1)/2):0),q=clamp(p.quality+(auto?(l-1)*1.5:0),10,100);
 addGoods(p.strain+'|',qty,q);floatText(`+${qty} ${S.n}`,S.c,plotWorld(i));
 const sid=p.strain;Object.assign(p,{state:'empty',strain:null,growth:0,water:0,qAcc:0,quality:0});
 if(auto&&G.auto&&G.money>=S.seed&&G.rep>=S.rep)plantPlot(i,sid);markDirty()}
const plotWorld=i=>new V3(OFF+PLOT[i][0],2.5,PLOT[i][1]);
function simulate(dt){
 G.tod+=dt/DAY_LEN;if(G.tod>=1){G.tod-=1;G.day++;onNewDay()}
 const wl=lvl('regador'),ef=eff();
 G.plots.forEach((p,i)=>{if(i>=G.plotCount||p.state!=='growing')return;const S=strOf(p.strain);p.water=Math.max(0,p.water-1.5*dt);
  if(p.water>0){const g=dt/S.time;p.growth+=g;p.qAcc+=(p.water>25?1:.25)*g}
  if(p.growth>=1){p.growth=1;p.state='ready';p.quality=clamp(30+60*(p.qAcc/p.growth)+(wl-1)*1.5,20,100);markDirty()}});
 // regador
 let j=jobs.regador;
 if(j){j.t-=dt*ef;if(j.t<=0){const p=G.plots[j.i];if(p&&p.state==='growing')p.water=Math.min(100,p.water+70);jobs.regador=null}}
 else{let best=-1,bw=45;for(let i=0;i<G.plotCount;i++){const p=G.plots[i];if(p.state==='growing'&&p.water<bw){bw=p.water;best=i}}if(best>=0)jobs.regador={i:best,t:Math.max(.8,3.2-.22*(wl-1))}}
 // cosechador
 j=jobs.cosechador;
 if(j){j.t-=dt*ef;if(j.t<=0){harvestPlot(j.i,true);jobs.cosechador=null}}
 else{const cl=lvl('cosechador');for(let i=0;i<G.plotCount;i++)if(G.plots[i].state==='ready'){jobs.cosechador={i,t:Math.max(1,4-.3*(cl-1))};break}}
 // técnico
 if(G.queue.length){const q=G.queue[0],tl=lvl('tecnico');q.p+=dt*ef*(1+.2*(tl-1))/(24*(q.n/3));
  if(q.p>=1){const key=q.s+'|'+q.i;addGoods(key,q.n,clamp(q.q+(tl-1)*.5,0,100));
   if(!G.disc[key]){G.disc[key]=true;G.rep=Math.min(100,G.rep+1.5);toast(`🧪 ¡Nueva variedad descubierta: <b>${goodName(key)}</b>! Sinergia ×${synergy(q.s,q.i).toFixed(2)}`,'ok')}
   else toast(`${nm('tecnico')} termina ${q.n}× ${goodName(key)}`,'ok');
   G.queue.shift();sfx('up');markDirty()}}
 // misiones
 for(const m of [...G.missions]){m.t+=dt*ef;const T1=m.d/m.speed,T=2*T1+m.wait;
  if(!m.arrived&&m.t>=T1+m.wait){m.arrived=true;if(MIS[m.type].arrive(m)==='remove'){G.missions=G.missions.filter(x=>x!==m);markDirty();continue}markDirty()}
  if(m.t>=T){MIS[m.type].done(m);G.missions=G.missions.filter(x=>x!==m);markDirty()}}
}
function onNewDay(){
 G.heat=Math.max(0,G.heat-6);
 if(G.day-G.lastPay>=PAY_EVERY){G.lastPay=G.day;G.owed+=payroll();toast(`💸 Día de paga: ${fmt(G.owed)}`,'warn')}
 if(G.owed>0){if(G.money>=G.owed){G.money-=G.owed;G.owed=0;toast('Salarios pagados. El equipo trabaja a pleno rendimiento.','ok')}else toast('⚠ No hay dinero para los salarios: el equipo trabaja a medio ritmo.','bad')}
 if(Math.random()<.07){G.heat=Math.min(100,G.heat+15);toast('🚨 Operativo policial en la ciudad: sube el calor.','bad')}
 saveGame();markDirty()}
const MIS={
 expedition:{arrive(m){const I=ingOf(m.data.ing),l=lvl('buscador');let n=3+Math.floor(l/2);if(Math.random()<.08*l)n+=2;m.data.n=n;toast(`${nm('buscador')} encontró ${n}× ${I.n}. Vuelven a La Tinto.`)},
  done(m){const I=ingOf(m.data.ing);G.inv.ing[I.id]=(G.inv.ing[I.id]||0)+m.data.n;toast(`📦 Llegan con ${m.data.n}× ${I.n}`,'ok');sfx('coin')}},
 delivery:{arrive(m){const d=m.data,D=DIST[d.di],S=G.d[d.di],r=riskInfo(d.di),pos=dpos(d.di),val=unitPrice(d.key,d.q,d.di)*d.qty,roll=Math.random();
  if(roll<r.pol){const fine=Math.round(val*.35+50);G.money=Math.max(0,G.money-fine);G.heat=Math.min(100,G.heat+8);S.trust=Math.max(0,S.trust-1.5);toast(`🚓 ¡Redada en ${D.n}! Pierdes la mercancía y una multa de ${fmt(fine)}.`,'bad');floatText('REDADA','#fb7185',pos)}
  else if(roll<r.pol+r.gang){S.trust=Math.max(0,S.trust-2);toast(`🔪 Emboscada de ${D.rival} en ${D.n}: pierdes la mercancía.`,'bad');floatText('EMBOSCADA','#fb7185',pos)}
  else{const rev=revenue(d.qty,unitPrice(d.key,d.q,d.di));gain(Math.round(rev),pos);G.stats.delivered+=d.qty;S.trust=Math.min(100,S.trust+.6+d.qty*.12);G.rep=Math.min(100,G.rep+.4+d.qty*.03);G.heat=Math.min(100,G.heat+d.qty*.8);toast(`✅ Reparto en ${D.n}: ${d.qty}× ${goodName(d.key)} por ${fmt(rev)}`,'ok')}markDirty()},
  done(m){toast(`${nm('repartidor')} vuelve a La Tinto.`)}},
 scout:{arrive(m){const S=G.d[m.data.di],l=lvl('ojeador'),g=5+1.3*l+rnd(-1,2);S.trust=Math.min(100,S.trust+g);S.scouted=true;toast(`👁 ${nm('ojeador')} analiza ${DIST[m.data.di].n}: confianza +${g.toFixed(1)}`,'ok')},done(){}},
 assault:{arrive(m){const di=m.data.di,S=G.d[di],D=DIST[di],l=lvl('asaltante'),ch=clamp(.2+.04*l+S.trust*.004,.1,.9),pos=dpos(di);
  if(Math.random()<ch){const loot=Math.round((150+Math.random()*250)*(1+.15*l)*D.loot);gain(loot,pos);G.heat=Math.min(100,G.heat+3);m.data.goods=Math.random()<.4;toast(`🥷 ${nm('asaltante')} asalta a ${D.rival}: botín de ${fmt(loot)}`,'ok')}
  else if(S.trust<35&&Math.random()<.6){G.kidnap={id:roleChar('asaltante').id,di,ransom:350+120*l};S.trust=Math.max(0,S.trust-3);toast(`⛓ ¡${nm('asaltante')} ha sido secuestrado por ${D.rival}! Paga el rescate (${fmt(G.kidnap.ransom)}).`,'bad');floatText('SECUESTRADO','#fb7185',pos);return 'remove'}
  else{G.money=Math.max(0,G.money-40);S.trust=Math.max(0,S.trust-1);toast(`${nm('asaltante')} falla el asalto en ${D.n} y huye herido.`,'bad')}},
  done(m){if(m.data.goods){const s=Math.random()<.6?'verdina':'azulita',n=2+Math.floor(Math.random()*4);addGoods(s+'|',n,rnd(55,75));toast(`Trae ${n}× ${strOf(s).n} robadas.`,'ok')}}}
};

let tw=null;
function tweenCam(pos,tgt,dur,done){tw={t0:performance.now(),dur,p0:camera.position.clone(),p1:pos.clone(),a:controls.target.clone(),b:tgt.clone(),done}}
function stepTween(now){if(!tw)return;const k=clamp((now-tw.t0)/tw.dur,0,1),e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;camera.position.lerpVectors(tw.p0,tw.p1,e);controls.target.lerpVectors(tw.a,tw.b,e);camera.lookAt(controls.target);if(k>=1){const d=tw.done;tw=null;d&&d()}}
function fade(o,cb){$('#fade').style.opacity=o;setTimeout(()=>cb&&cb(),330)}

 if(mode==='city'){sun.position.set(Math.cos(a)*70,Math.max(10,el*85),35);sun.intensity=.2+.95*day;sun.color.setHSL(.1,.15+.5*(1-day),.75+.25*day);hemi.intensity=.3+.5*day;room.intensity=0;bgC.copy(nightC).lerp(dayC,day);scene.background=bgC;if(scene.fog)scene.fog.color.copy(bgC);
  lampM.emissiveIntensity=(1-day)*2;bMats.forEach(m=>m.emissiveIntensity=(1-day)*1.1+.05)}

function endTut(){tut.active=false;G.tutDone=true;$('#tut').innerHTML='';$('#tring').style.display='none';hlSel=null;applyHl();toast('Consejo: planta, riega y reparte. ¡Buena suerte, Boss!','ok')}
function applyHl(){$$('.hl').forEach(e=>e.classList.remove('hl'));if(hlSel&&tut.active)$$(hlSel).forEach(e=>e.classList.add('hl'))}

/* ====================== SELECCIÓN DE PERSONAJE ====================== */
function showSelect(){let pick=null;const hasSave=!!localStorage.getItem(SAVE_KEY);
 const render=()=>{$('#sel').innerHTML=`<div class="hd" style="font-size:34px;font-weight:700;letter-spacing:.04em;margin-top:10px">LA <span style="color:var(--acc)">TINTO</span></div><div style="color:#a79bb8;margin-top:4px;text-align:center">Elige quién será el Boss. Si no eliges a Jeilian, él ocupará el rol que dejes vacante.</div>
 <div class="cg">${CHARS.map(c=>`<div class="cc ${pick===c.id?'on':''}" data-c="${c.id}"><div style="width:84px;height:84px;margin:0 auto 6px">${portrait(c)}</div><b class="hd">${c.n}</b><div class="text-xs" style="color:var(--acc2)">${ROLES[c.role].i} ${ROLES[c.role].s}</div><div class="text-xs mt-1" style="color:#a79bb8">${c.desc}</div></div>`).join('')}</div>
 <div style="min-height:44px;color:#d6cde4;text-align:center" class="text-sm">${pick?(pick==='jeilian'?'<b>Jeilian</b> se queda como Boss.':`<b>${charById(pick).n}</b> será el Boss. <b>Jeilian</b> asumirá el puesto de <b>${ROLES[charById(pick).role].n}</b>.`):'Selecciona un personaje.'}</div>
 <div class="flex gap-2 mb-6"><button class="btn btn-p" id="goBtn" ${pick?'':'disabled'} style="padding:11px 22px;font-size:14px">Empezar como Boss</button>${hasSave?'<button class="btn btn-g" id="loadBtn" style="padding:11px 22px;font-size:14px">Continuar partida</button>':''}</div>`;
 $$('.cc').forEach(e=>e.onclick=()=>{pick=e.dataset.c;sfx('click');render()});
 const gb=$('#goBtn');if(gb)gb.onclick=()=>{if(pick)startGame(pick,false)};const lb=$('#loadBtn');if(lb)lb.onclick=()=>startGame(null,true)};
 render()}
function startGame(bossId,load){
 if(load){try{G=JSON.parse(localStorage.getItem(SAVE_KEY))}catch(e){G=null}if(!G){toast('No se pudo cargar la partida','bad');return}}else newGame(bossId);
 $('#sel').style.display='none';started=true;controls.autoRotate=false;
 for(let i=0;i<9;i++)buildDistrict(i);updateFrames();refreshLabels();placeChars();updateLighting();markDirty();updateHud();
 tweenCam(new V3(52,60,70),new V3(0,0,0),1600);
 if(!G.tutDone)setTimeout(startTut,1500);else toast(`Bienvenido de nuevo, ${charById(G.boss).n}.`)}
function saveGame(manual){try{localStorage.setItem(SAVE_KEY,JSON.stringify(G));if(manual)toast('💾 Partida guardada','ok')}catch(e){if(manual)toast('No se pudo guardar','bad')}}
window.addEventListener('beforeunload',()=>{if(G&&started)saveGame()});

/* ====================== ANIMACIÓN ====================== */
function clampTarget(){const t=controls.target,c=mode==='city'?[-60,60,-60,60]:[OFF-14,OFF+14,-8,8];const nx=clamp(t.x,c[0],c[1]),nz=clamp(t.z,c[2],c[3]);camera.position.x+=nx-t.x;camera.position.z+=nz-t.z;t.x=nx;t.z=nz}
function updateInterior(rdt,t){
 const busy=busyChars(),rest=[];
 CHARS.forEach(c=>{const o=ich[c.id],role=G.roleOf[c.id];if(busy.has(c.id)){o.g.visible=false;o.vis=false;return}
  if(!o.vis){o.vis=true;o.g.visible=true;const p=role==='boss'?BOSS_POS:DOOR;o.g.position.set(p[0],0,p[1])}
  o.work=false;let tg=null;
  if(role==='boss')tg=BOSS_POS;
  else if(role==='regador'&&jobs.regador){const p=PLOT[jobs.regador.i];tg=[p[0]+.9,p[1]+2.5];o.work=true}
  else if(role==='cosechador'&&jobs.cosechador){const p=PLOT[jobs.cosechador.i];tg=[p[0]-.9,p[1]+2.5];o.work=true}
  else if(role==='tecnico'&&G.queue.length){tg=LAB_POS;o.work=true}
  if(tg)o.tg=tg;else rest.push(c)});
 rest.forEach((c,k)=>{ich[c.id].tg=REST[k%REST.length]});
 CHARS.forEach(c=>{const o=ich[c.id];if(!o.vis)return;const g=o.g,dx=o.tg[0]-g.position.x,dz=o.tg[1]-g.position.z,d=Math.hypot(dx,dz);
  if(d>.08){const s=Math.min(d,5*rdt);g.position.x+=dx/d*s;g.position.z+=dz/d*s;g.rotation.y=Math.atan2(dx,dz);g.position.y=Math.abs(Math.sin(t*10))*.12}
  else{g.rotation.y+=(0-g.rotation.y)*.1;g.position.y=o.work?Math.abs(Math.sin(t*6))*.08:Math.sin(t*1.5+c.h*7)*.02}});
 plotVis.forEach((v,i)=>{if(i>=G.plotCount){v.table.material=v.ghost;v.plant.visible=false;v.bar.visible=false;v.pot.visible=false;return}
  if(v.table.material===v.ghost)v.table.material=M('#5b4636');v.pot.visible=true;const p=G.plots[i];
  if(p.state==='empty'){v.plant.visible=false;v.bar.visible=false;return}
  const S=strOf(p.strain);v.plant.visible=true;v.bar.visible=true;const sc=.25+.75*p.growth;v.plant.scale.set(sc,sc,sc);
  const col=p.water<15?'#8a7a3a':S.c;if(v.col!==col){v.leaf.color.set(col);v.col=col}
  v.bud.visible=p.state==='ready';if(p.state==='ready'){v.bud.material.emissive.set(S.c);v.bud.material.color.set(S.c);v.bud.material.emissiveIntensity=.6+Math.sin(t*4)*.4}
  v.bar.scale.x=Math.max(.01,p.water/100);v.bar.position.x=PLOT[i][0]-1.3*(1-p.water/100);v.wm.color.set(p.water<25?'#ef4444':'#38bdf8')});
 const q=G.queue[0];if(q){labGlow.color.set(ingOf(q.i).c);labGlow.emissive.set(ingOf(q.i).c);labGlow.emissiveIntensity=.5+Math.sin(t*5)*.25}else labGlow.emissiveIntensity=.2;
 labSteam.forEach(s=>{s.visible=!!q;if(q){s.userData.p=(s.userData.p+rdt*.4)%1;const p=s.userData.p;s.position.set(18+Math.sin(p*9+s.userData.p*3)*.5,2.9+p*3,-8.5);s.material.opacity=.4*(1-p);s.scale.setScalar(.6+p)}});
 ledMats.forEach((m,r)=>m.color.setHSL(.88+Math.sin(t*.7+r)*.02,.9,.6))}
function updateCity(t){
 carA.visible=carB.visible=false;CHARS.forEach(c=>cityChars[c.id].visible=false);
 G.missions.forEach(m=>{const p=missionPos(m);const car=m.type==='expedition'?carA:m.type==='delivery'?carB:null,o=car||cityChars[m.chars[0]];o.visible=true;
  const pv=o.userData.lp;if(pv){const dx=p.x-pv.x,dz=p.z-pv.z;if(Math.hypot(dx,dz)>.002)o.userData.ang=car?Math.atan2(-dz,dx):Math.atan2(dx,dz)}
  o.rotation.y=o.userData.ang||0;const ph=phaseOf(m);o.position.set(p.x,car?0:(ph===1?0:Math.abs(Math.sin(t*10))*.3),p.z);o.userData.lp=p;
  if(car)setLabel(o.userData.label,`${m.chars.map(id=>charById(id).n).join(' + ')}\n${['En camino','Actuando…','Volviendo'][ph]}`);
  else setLabel(o.userData.label,`${charById(m.chars[0]).n}\n${['En camino','Actuando…','Volviendo'][ph]}`)});
 if(tintoMat)tintoMat.emissiveIntensity=.3+Math.sin(t*2)*.12;if(beam)beam.material.opacity=.12+Math.sin(t*1.6)*.04;
 if(selFrame.visible)selFrame.children.forEach(m=>m.scale.y=1+Math.sin(t*4)*.2)}
function updateRing(){const r=$('#tring');if(!tut.active||!TUT[tut.i].ring||mode!=='city'){r.style.display='none';return}const v=new V3(0,6,6).project(camera);if(v.z>1){r.style.display='none';return}r.style.display='block';r.style.left=(v.x*.5+.5)*innerWidth+'px';r.style.top=(-v.y*.5+.5)*innerHeight+'px'}
let last=performance.now(),uiT=0,lightT=0;
function frame(now){requestAnimationFrame(frame);const rdt=Math.min(.1,(now-last)/1000);last=now;const t=now/1000;
 if(G&&started){if(UI.speed>0&&!tut.active)simulate(rdt*UI.speed);
  if(mode==='interior')updateInterior(rdt,t);updateCity(t);
  lightT+=rdt;if(lightT>.3){lightT=0;updateLighting();updateFrames()}
  uiT+=rdt;if(UI.dirty){UI.dirty=false;renderPanel();updateHud();uiT=0}else if(uiT>.25){uiT=0;updateBinds();updateHud()}
  updateRing()}
 stepTween(now);controls.enabled=!tw&&started&&!busyCam;if(!tw){controls.update();if(started)clampTarget()}
 renderer.render(scene,camera)}
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

/* ====================== ARRANQUE ====================== */
buildCity();buildCityActors();buildInterior();applyMode();
controls.target.set(0,0,0);
if(innerWidth<700){$('#side').classList.add('off');UI.panelHidden=true}
showSelect();
requestAnimationFrame(frame);
</script>
</body>
</html>
