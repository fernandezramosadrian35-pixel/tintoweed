<style>

.sbtn.on{border-color:var(--acc2);background:linear-gradient(180deg,rgba(45,212,191,.28),rgba(45,212,191,.1));box-shadow:0 0 14px rgba(45,212,191,.35)}.sbtn:disabled{opacity:.4;cursor:not-allowed}
.w-full{width:100%}.mt-1{margin-top:4px}.mt-2{margin-top:8px}.mt-3{margin-top:14px}.mb-2{margin-bottom:8px}
.row{display:flex;gap:8px;align-items:center}.row.sp{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.chip{font-size:11px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.12);white-space:nowrap}
.chip.ok{background:rgba(74,222,128,.22);color:var(--ok)}.chip.bad{background:rgba(255,107,136,.22);color:var(--bad)}.chip.warn{background:rgba(255,179,71,.22);color:var(--warn)}
.pip{display:inline-block;width:10px;height:6px;border-radius:3px;background:rgba(255,255,255,.17);margin-right:2px}.pip.on{background:var(--acc2)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
#mstrip{position:fixed;left:8px;top:calc(64px + env(safe-area-inset-top));z-index:20;width:min(230px,56vw);display:flex;flex-direction:column;gap:5px;pointer-events:none}
.ms{background:rgba(24,12,40,.88);border:2px solid var(--line);border-radius:14px;padding:6px 9px;font-size:11px}
#fabs{position:fixed;left:10px;right:10px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:22;display:flex;justify-content:space-between;pointer-events:none}

#hint{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:12px;color:#fff;z-index:15;pointer-events:none;text-align:center;width:min(360px,88vw);text-shadow:0 1px 4px #000;transition:opacity .2s}

#selbar{width:100%;padding:12px 12px calc(14px + env(safe-area-inset-bottom));background:rgba(20,10,32,.96);border-top:2px solid var(--line);text-align:center}
#tut{position:fixed;inset:0;z-index:85;pointer-events:none}
.tb{position:absolute;left:10px;right:10px;top:calc(66px + env(safe-area-inset-top));margin:0 auto;max-width:480px;pointer-events:auto;border-radius:24px;padding:14px 14px 12px;border:3px solid var(--acc);box-shadow:0 0 34px rgba(255,77,184,.45)}

@keyframes pr{0%{transform:scale(.7);opacity:1}100%{transform:scale(1.5);opacity:.1}}
@keyframes nudge{to{transform:translateY(-10px)}}
.hl{position:relative;z-index:5;outline:4px solid #fff200;outline-offset:3px;box-shadow:0 0 0 8px rgba(255,242,0,.35),0 0 32px 8px rgba(255,242,0,.85)!important;animation:hlp .8s infinite alternate}

.hl::after{content:'👇';position:absolute;left:50%;top:-38px;margin-left:-14px;font-size:28px;animation:nudge .6s infinite alternate;pointer-events:none}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:9px}
@media(max-width:420px){.pill{padding:3px 8px 3px 6px}.pill b{font-size:14px}#hClock b{font-size:15px}.pill .ic{font-size:18px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>

function recReason(R,sid,n){const l=lvl('tecnico');if(l<R.minLvl)return `Requiere ${nm('tecnico')} nivel ${R.minLvl}`;
 const raw=G.inv.goods[sid+'|'];if(!raw||raw.qty<R.herb*n)return `Faltan ${R.herb*n} ${strOf(sid).n}`;
 for(const[k,v]of Object.entries(R.ing))if((G.inv.ing[k]||0)<v*n)return `Falta ${ingOf(k).n} ×${v*n}`;
 if(G.queue.length>=6)return 'Cola llena';return ''}

 $('#tut').innerHTML=`<div class="tb glass"><div class="row mb-2">${S.map((_,k)=>`<span class="pip ${k<=tut.i?'on':''}" style="flex:1;height:6px"></span>`).join('')}</div><div class="hd" style="font-size:21px;margin-bottom:4px">${st.t()}</div><div style="font-size:13px;color:#e8e0f4;line-height:1.5">${st.x()}</div><div id="tnote" class="sub warn mt-1" style="min-height:16px"></div>
 <div class="row sp mt-2"><button class="btn" id="tSkip">Saltar</button>${st.wait?'<span class="sub">👆 Hazlo para continuar</span>':`<button class="btn btn-p" id="tNext" style="min-width:140px">${st.last?'¡Empezar!':'Siguiente'}</button>`}</div></div>`;
 $('#tSkip').onclick=endTut;const nb=$('#tNext');if(nb)nb.onclick=()=>{sfx('click');nextTut()}}
function endTut(){tut.active=false;G.tutDone=true;$('#tut').innerHTML='';$('#tring').style.display='none';document.body.classList.remove('intut');applyHl();updateChrome();toast('Planta, elabora y reparte. ¡Buena suerte, Boss!','ok')}
function curHl(){const st=curStep();if(!st)return null;if(st.at&&st.at.mode!==mode&&!busyCam&&!tw)return '#fabL';return st.hl?st.hl():null}
function applyHl(){const sel=curHl();const want=sel?$$(sel):[];$$('.hl').forEach(e=>{if(!want.includes(e))e.classList.remove('hl')});want.forEach(e=>e.classList.add('hl'))}
function noteFor(st){if(!st.at||busyCam||tw)return '';if(st.at.mode!==mode)return st.at.mode==='interior'?'↩ Entra primero en La Tinto (botón 🏠).':'↩ Vuelve a la ciudad (botón 🏙).';return st.note?st.note():''}
function tutTick(){const st=curStep();if(!st)return;
 if(st.at&&st.at.mode!==mode&&!busyCam&&!tw&&SH.type)closeSheet();
 if(st.wait&&!tut.adv&&st.wait()){tut.adv=true;sfx('up');setTimeout(()=>{tut.adv=false;nextTut()},700)}
 const nt=$('#tnote');if(nt){const n=noteFor(st);if(nt.textContent!==n)nt.textContent=n}
 applyHl()}
function updateRing(){const r=$('#tring'),st=curStep();if(!st||!st.at||!st.at.pos||st.at.mode!==mode||busyCam||tw||SH.type){r.style.display='none';return}
 const v=st.at.pos().clone().project(camera);if(v.z>1){r.style.display='none';return}r.style.display='block';r.style.left=(v.x*.5+.5)*innerWidth+'px';r.style.top=(-v.y*.5+.5)*innerHeight+'px'}

/* ====================== SELECCIÓN DE PERSONAJE ====================== */
function showSelect(){let chosen=null;let hasSave=false;try{hasSave=!!localStorage.getItem(SAVE_KEY)}catch(e){}
 const render=()=>{const sc=$('#sel .scr');const top=sc?sc.scrollTop:0;
 $('#sel').innerHTML=`<div class="scr"><div class="hd" style="font-size:34px;font-weight:700;letter-spacing:.04em">LA <span style="color:var(--acc)">TINTO</span></div><div class="sub" style="margin-top:4px;text-align:center;max-width:460px">Elige quién será el Boss. Si no eliges a Jeilian, él ocupará el rol que dejes vacante.</div>
 <div class="cg">${CHARS.map(c=>`<div class="cc ${chosen===c.id?'on':''}" data-c="${c.id}"><div style="width:80px;height:80px;margin:0 auto 6px">${portrait(c)}</div><b class="hd">${c.n}</b><div class="sub" style="color:var(--acc2)">${ROLES[c.role].i} ${ROLES[c.role].s}</div><div class="sub mt-1">${c.desc}</div></div>`).join('')}</div></div>
 <div id="selbar"><div class="sub" style="color:#d6cde4;min-height:34px;margin-bottom:8px">${chosen?(chosen==='jeilian'?'<b>Jeilian</b> se queda como Boss.':`<b>${charById(chosen).n}</b> será el Boss. <b>Jeilian</b> asumirá el puesto de <b>${ROLES[charById(chosen).role].n}</b>.`):'Selecciona un personaje.'}</div>
 <div class="row" style="justify-content:center"><button class="btn btn-p" id="goBtn" ${chosen?'':'disabled'} style="min-width:180px;min-height:50px;font-size:15px">Empezar como Boss</button>${hasSave?'<button class="btn btn-g" id="loadBtn" style="min-height:50px">Continuar</button>':''}</div></div>`;
 const s2=$('#sel .scr');if(s2)s2.scrollTop=top;
 $$('.cc').forEach(e=>e.onclick=()=>{chosen=e.dataset.c;sfx('click');render()});
 const gb=$('#goBtn');if(gb)gb.onclick=()=>{if(chosen)startGame(chosen,false)};const lb=$('#loadBtn');if(lb)lb.onclick=()=>startGame(null,true)};
 render()}
function startGame(bossId,load){
 if(load){try{G=JSON.parse(localStorage.getItem(SAVE_KEY))}catch(e){G=null}if(!G||G.v!==2){G=null;toast('No se pudo cargar la partida','bad');return}G.wq=G.wq||[];G.labTables=G.labTables||1;G.brk=G.brk||{};G.tabs=G.tabs||[null,null,null];G.zones=G.zones||ZN.map(()=>({scouted:false}))}else newGame(bossId);
 $('#sel').style.display='none';started=true;controls.autoRotate=false;
 for(let i=0;i<9;i++)buildDistrict(i);ZN.forEach((_,i)=>refreshZone(i));updateFrames();refreshLabels();placeChars();updateLighting();markDirty();updateHud();updateChrome();
 const v=cityView();tweenCam(v.pos,v.tg,1600);
 if(!G.tutDone)setTimeout(startTut,1500);else toast(`Bienvenido de nuevo, ${charById(G.boss).n}.`)}
function saveGame(manual){try{localStorage.setItem(SAVE_KEY,JSON.stringify(G));if(manual)toast('💾 Partida guardada','ok')}catch(e){if(manual)toast('No se pudo guardar','bad')}}
addEventListener('beforeunload',()=>{if(G&&started)saveGame()});

/* ====================== ANIMACIÓN ====================== */
function clampTarget(){const t=controls.target,c=mode==='city'?[-110,110,-110,110]:[OFF-26,OFF+26,-13,13];const nx=clamp(t.x,c[0],c[1]),nz=clamp(t.z,c[2],c[3]);camera.position.x+=nx-t.x;camera.position.z+=nz-t.z;t.x=nx;t.z=nz}
let labT=0,smokeT=0;
function updateInterior(sdt,rdt,t){
 const away=awayChars(),head=headingChars(),rest=[],iz=ich[roleChar('tecnico').id],izIn=iz.vis&&iz.g.position.x>13.2;
 const act=[];for(let k=0;k<G.labTables;k++)if(G.tabs[k])act.push(k);
 CHARS.forEach(c=>{const o=ich[c.id],role=G.roleOf[c.id];
  if(away.has(c.id)){o.g.visible=false;o.vis=false;return}
  if(!o.vis){o.vis=true;o.g.visible=true;o.g.position.set(DOOR[0],0,DOOR[1])}
  o.work=false;let tg=null;const resting=(G.brk[c.id]||0)>0;setLabel(o.g.userData.label,resting?`${c.n}\n😴 ${Math.ceil(G.brk[c.id])}s`:`${c.n}\n${ROLES[role].i} ${ROLES[role].s}`);
  if(head.has(c.id))tg=DOOR;
  else if(role==='boss')tg=BOSS_POS;
  else if(role==='regador'&&jobs.regador&&!resting){tg=jobs.regador.p;o.work=jobs.regador.st==='act'}
  else if(role==='cosechador'&&jobs.cosechador&&!resting){tg=jobs.cosechador.p;o.work=jobs.cosechador.st==='act'}
  else if(role==='tecnico'&&act.length&&!resting){tg=labStand(act[Math.floor(t/7)%act.length]);o.work=izIn}
  if(tg)o.tg=tg;else rest.push(c)});
 rest.forEach((c,k)=>{ich[c.id].tg=REST[k%REST.length]});
 CHARS.forEach(c=>{const o=ich[c.id];if(!o.vis)return;const g=o.g,b=o.body,dx=o.tg[0]-g.position.x,dz=o.tg[1]-g.position.z,d=Math.hypot(dx,dz);
  if(d>.08){const s=Math.min(d,3.6*sdt);g.position.x+=dx/d*s;g.position.z+=dz/d*s;if(sdt>0){let da=Math.atan2(dx,dz)-b.rotation.y;da=Math.atan2(Math.sin(da),Math.cos(da));b.rotation.y+=da*Math.min(1,12*rdt)}b.scale.setScalar(1.2*(1+Math.abs(Math.sin(t*9))*.05));b.position.y=Math.abs(Math.sin(t*9))*.1}
  else{b.rotation.y+=(0-b.rotation.y)*.1;b.position.y=0;b.scale.setScalar(1.2*(o.work?1+Math.abs(Math.sin(t*6))*.06:1+Math.sin(t*1.5+c.h*7)*.01))}});
 plotVis.forEach((v,i)=>{
  if(i>=G.plotCount){v.tile.material=v.ghost;v.plant.visible=false;v.bw.visible=false;v.bg.visible=false;v.pot.visible=false;const ob=i===G.plotCount&&mode==='interior';v.ic.visible=ob;if(ob)setLabel(v.ic,'🔒 Ampliar','#fff','rgba(90,70,120,.92)');return}
  const p=G.plots[i];v.tile.material=v.tmat;v.pot.visible=true;
  let col='#3a2a1c';if(p.state==='growing')col=p.water<28?'#5a4a1a':'#1f4d2c';else if(p.state==='ready')col='#7a6414';
  if(v.tc!==col){v.tmat.color.set(col);v.tc=col}
  if(p.state==='empty'){v.plant.visible=false;v.bw.visible=false;v.bg.visible=false}
  else{const S=strOf(p.strain);v.plant.visible=true;const sc=.25+.75*p.growth;v.plant.scale.set(sc,sc,sc);const lc=p.water<15?'#8a7a3a':S.c;if(v.col!==lc){v.leaf.color.set(lc);v.col=lc}
   v.bud.visible=p.state==='ready';if(p.state==='ready'){v.bud.material.emissive.set(S.c);v.bud.material.color.set(S.c);v.bud.material.emissiveIntensity=.6+Math.sin(t*4)*.4}
   const gr=p.state==='ready'?1:p.growth,w=p.water/100;v.bg.visible=v.bw.visible=p.state==='growing';
   v.bg.scale.x=Math.max(.01,gr);v.bg.position.x=PLOT[i][0]-2*(1-gr);v.bw.scale.x=Math.max(.01,w);v.bw.position.x=PLOT[i][0]-2*(1-w);v.wm.color.set(p.water<25?'#ef4444':'#38bdf8')}
  let txt='',bgc='rgba(255,77,184,.95)';
  if(p.state==='empty')txt='🌱 Sembrar';else if(p.state==='ready'){txt='🌾 ¡Cosechar!';bgc='rgba(30,160,90,.95)'}else if(p.water<28){txt='💧 Sed';bgc='rgba(20,120,210,.95)'}else{txt='🌿 '+Math.floor(p.growth*100)+'%';bgc='rgba(20,90,50,.92)'}
  v.ic.visible=mode==='interior';setLabel(v.ic,txt,'#fff',bgc);v.ic.position.y=1.1+Math.sin(t*3+i)*.12});
 labT+=rdt;const tick=labT>.12;if(tick)labT=0;
 labTabs.forEach((T,k)=>{const own=k<G.labTables,q=G.tabs[k];T.table.material=own?T.mat:T.ghost;T.fl.forEach(f=>f.visible=own);
  if(own){const ex=!!q&&recOf(q.r).kind==='exotica',col=q?(ex?'#c084fc':'#2dd4bf'):'#5b6b7a';if(T.cc!==col){T.glow.color.set(col);T.glow.emissive.set(col);T.cc=col}
   T.glow.emissiveIntensity=q?(izIn?.6+Math.sin(t*5)*.25:.3):.1;
   setLabel(T.lab,q?`⚗️ Mesa ${k+1} · ${Math.floor(q.p*100)}%`:`⚗️ Mesa ${k+1} · libre`,'#fff',q?'rgba(10,120,140,.94)':'rgba(40,50,70,.9)');
   if(q&&izIn&&tick&&mode==='interior')T.fx.forEach(f=>{if(Math.random()<.6)spawnFx(OFF+f[0]+rnd(-.2,.2),1.8,f[1]+rnd(-.2,.2),rnd(-.3,.3),rnd(.8,1.6),rnd(-.3,.3),ex?'#d8a8ff':'#7ef0e0',.5,1.5,{grow:.6,op:.9})})}
  else setLabel(T.lab,`🔒 Mesa ${k+1}\n${fmt(TABCOST[k])}`,'#fff','rgba(90,70,120,.94)')})}
function updateCity(rdt,t){
 carA.visible=carB.visible=moto.visible=false;CHARS.forEach(c=>{const o=cityChars[c.id];o.visible=false;if(o.parent===moto)scene.add(o)});
 smokeT+=rdt;const emit=smokeT>.07;if(emit)smokeT=0;
 G.missions.forEach(m=>{if(m.pre)return;const p=missionPos(m),ph=phaseOf(m);let o,veh=true;
  if(m.type==='expedition')o=carA;else if(m.type==='delivery')o=carB;else if(m.type==='assault'){o=moto;const r=cityChars[m.chars[0]];if(r.parent!==moto)moto.add(r);r.position.set(-.2,.1,0);r.rotation.set(0,Math.PI/2,0);r.scale.setScalar(1.1);r.visible=true;setLabel(r.userData.label,`${charById(m.chars[0]).n}\n${['A toda velocidad','Asaltando…','Huyendo'][ph]}`)}
  else{o=cityChars[m.chars[0]];veh=false}
  o.visible=true;const pv=o.userData.lp;let moving=ph!==1;
  if(pv){const dx=p.x-pv.x,dz=p.z-pv.z;if(Math.hypot(dx,dz)>.002)o.userData.ang=veh?Math.atan2(-dz,dx):Math.atan2(dx,dz)}
  o.rotation.y=o.userData.ang||0;o.position.set(p.x,veh?0:(moving?Math.abs(Math.sin(t*8))*.3:0),p.z);o.userData.lp=p;
  const names=m.chars.map(id=>charById(id).n).join(' + '),st=['En camino','Actuando…','Volviendo'][ph];
  if(o.userData.label&&m.type!=='assault')setLabel(o.userData.label,`${names}\n${st}`);
  if(veh&&moving&&emit){const ex=o.userData.exhaust,a=o.userData.ang||0,c=Math.cos(a),s=Math.sin(a);spawnFx(p.x+ex[0]*c+ex[2]*s,ex[1],p.z-ex[0]*s+ex[2]*c,rnd(-.3,.3),rnd(.5,1),rnd(-.3,.3),m.type==='assault'?'#9ca3af':'#6b7280',m.type==='assault'?.8:1.1,1.2,{grow:1.8,add:false,op:.45})}});
 if(tintoMat)tintoMat.emissiveIntensity=.06+NF*(.9+Math.sin(t*2)*.15);if(beam){beam.visible=NF>.06;beam.material.opacity=NF*(.4+Math.sin(t*1.6)*.06)}bobs.forEach(b=>{b.s.position.y=b.y0+Math.sin(t*3+b.ph)*.45});
 if(selFrame.visible)selFrame.children.forEach(m=>m.scale.y=1+Math.sin(t*4)*.2);
 ZN.forEach((Z,zi)=>{const c=zoneG[zi].userData.crystal;if(c){c.rotation.y=t*.8;c.position.y=3+Z.tier*.4+Math.sin(t*1.5+zi)*.3}})}
let uiT=0,lightT=0;
function frame(now){requestAnimationFrame(frame);try{frameBody(now)}catch(e){if(!frame.err){frame.err=1;console.error('[La Tinto] error en un fotograma',e)}}}
let last=performance.now();
function frameBody(now){const rdt=Math.min(.1,(now-last)/1000);last=now;const t=now/1000;
 if(G&&started){const paused=tut.active||UI.speed===0,sp=paused?0:UI.speed,sdt=rdt*Math.min(sp,4);
  if(sp>0)simulate(rdt*sp);
  updateInterior(sdt,rdt,t);updateCity(rdt,t);
  lightT+=rdt;if(lightT>.25){lightT=0;updateLighting();updateFrames()}
  uiT+=rdt;if(UI.dirty&&!UI.press){UI.dirty=false;if(SH.type)renderSheet();else renderStrip();updateHud();uiT=0}else if(uiT>.25){uiT=0;updateBinds();updateHud()}
  updateRing();if(tut.active)tutTick()}
 stepFx(rdt);stepTween(now);updateViewOffset();controls.enabled=!tw&&started&&!busyCam;if(!tw){controls.update();if(started)clampTarget()}
 renderer.render(scene,camera)}
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();lastVo=-1}
addEventListener('resize',resize);

/* ====================== ARRANQUE ====================== */
function boot(){
 try{
  if(typeof THREE==='undefined'||!THREE.OrbitControls)throw new Error('Three.js no está cargado');
  buildCity();buildCityActors();buildInterior();applyMode();
  {const v=cityView();camera.position.copy(v.pos);controls.target.set(0,0,0)}
  resize();showSelect();
  requestAnimationFrame(frame)
 }catch(e){__bootFail(e)}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
/*__APP_END__*/
}catch(e){__bootFail(e)}
})();
</script>
